<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f7f4ef;
    --ink: #1a1814;
    --muted: #8a8680;
    --accent: #1969ff;
    --nav-h: 72px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Averta', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── NAV ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: var(--cream);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    border-bottom: 1px solid rgba(26,24,20,0.08);
  }

  .logo {
    font-family: 'Averta', sans-serif;
    font-size: 1.35rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
  }
  .logo span { font-style: italic; color: var(--accent); }

  nav {
    display: flex;
    gap: 2.2rem;
    align-items: center;
  }

  nav a {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: lowercase;
    color: var(--ink);
    text-decoration: none;
    position: relative;
    transition: color 0.2s;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0; right: 0;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  nav a:hover { color: var(--accent); }
  nav a:hover::after,
  nav a.active::after { transform: scaleX(1); }
  nav a.active { color: var(--ink); }

  /* hamburger (mobile) */
  .menu-btn {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }
  .menu-btn span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--ink);
    transition: transform 0.25s, opacity 0.25s;
  }

  /* ── GALLERY ── */
  main {
    margin-top: var(--nav-h);
    padding: 2.5rem 2rem;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }

  .masonry {
    columns: 4 260px;
    column-gap: 1rem;
  }

  .item {
    break-inside: avoid;
    margin-bottom: 1rem;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }

  .item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94);
    filter: saturate(0.9);
  }

  .item:hover img {
    transform: scale(1.03);
    filter: saturate(1);
  }

  .item-overlay {
    position: absolute;
    inset: 0;
    background: rgba(26,24,20,0);
    transition: background 0.3s;
    display: flex;
    align-items: flex-end;
    padding: 1rem;
  }

  .item:hover .item-overlay {
    background: rgba(26,24,20,0.35);
  }

  .item-title {
    font-family: 'Averta', sans-serif;
    font-size: 0.9rem;
    color: var(--cream);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s, transform 0.3s;
  }

  .item:hover .item-title {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed;
    inset: 0;
    background: rgba(26,24,20,0.92);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-inner {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lb img {
    max-width: 85vw;
    max-height: 85vh;
    object-fit: contain;
    display: block;
    transform: scale(0.96);
    transition: transform 0.3s;
  }

  .lb.open img { transform: scale(1); }

  .lb-close {
    position: fixed;
    top: 1.5rem; right: 1.5rem;
    background: none;
    border: 1.5px solid rgba(247,244,239,0.4);
    color: var(--cream);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Averta', sans-serif;
  }

  .lb-close:hover {
    background: rgba(247,244,239,0.15);
    border-color: rgba(247,244,239,0.7);
  }

  .lb-nav {
    position: fixed;
    top: 50%; transform: translateY(-50%);
    background: none;
    border: 1.5px solid rgba(247,244,239,0.3);
    color: var(--cream);
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .lb-nav:hover { background: rgba(247,244,239,0.15); border-color: rgba(247,244,239,0.7); }
  .lb-prev { left: 1.5rem; }
  .lb-next { right: 1.5rem; }

  .lb-caption {
    position: fixed;
    bottom: 1.5rem; left: 0; right: 0;
    text-align: center;
    font-family: 'Averta', sans-serif;
    font-style: italic;
    color: rgba(247,244,239,0.65);
    font-size: 0.9rem;
    letter-spacing: 0.04em;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 4rem;
    padding: 2rem 2.5rem;
    border-top: 1px solid rgba(26,24,20,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover { color: var(--ink); }

  /* ── RESPONSIVE ── */
  /* @media (max-width: 768px) {
    header { padding: 0 1.25rem; }

    .masonry { columns: 2 140px; }
    .lb-prev { left: 0.5rem; }
    .lb-next { right: 0.5rem; }
  } */
@media (max-width: 768px) {
    header { 
      padding: 0 1rem; 
      flex-direction: column; /* Cambiamos a columna para dar espacio a las pestañas */
      height: auto; /* Dejamos que la altura se adapte al contenido */
      align-items: center;
    }

    .logo {
      padding: 0.8rem 0 0.5rem 0; /* Espaciado para el logo arriba */
    }

    /* Modificamos las variables del tamaño del menú para que la galería no se encime */
    :root {
      --nav-h: 95px; 
    }

    /* Mantenemos el nav siempre visible en formato de pestañas */
    nav { 
      display: flex !important; 
      flex-direction: row; 
      gap: 0; 
      width: 100%; 
      justify-content: center;
    }

    nav a {
      flex: 1; /* Cada pestaña toma el mismo ancho */
      text-align: center;
      padding: 0.6rem 0;
      font-size: 0.85rem; /* Un pelín más grande para que sea fácil de tocar con el dedo */
    }

    /* Ajustamos la línea decorativa inferior para que abarque más espacio en la pestaña móvil */
    nav a::after {
      bottom: 0;
    }

    /* Ya no necesitamos el comportamiento de menú desplegable */
    nav.open {
      position: static;
      padding: 0;
      border-bottom: none;
    }

    /* Ocultamos el botón de hamburguesa por completo */
    .menu-btn { display: none !important; }  

    main { padding: 1.5rem 1rem; }
    .masonry { columns: 2 140px; }
    .lb-prev { left: 0.5rem; }
    .lb-next { right: 0.5rem; }
  }

</style>
</head>

<script>
// --- mobile menu ---
  // --- const menuBtn = document.getElementById('menuBtn'); ---
  // --- const nav = document.getElementById('nav'); ---
  // --- menuBtn.addEventListener('click', () => nav.classList.toggle('open')); ---

  // --- lightbox adaptado para imágenes y videos ---
  const items = Array.from(document.querySelectorAll('.item'));
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lbImg');
  const lbVideo = document.getElementById('lbVideo'); // ✅ Seleccionamos el nuevo elemento de video
  const lbCaption = document.getElementById('lbCaption');
  let current = 0;

  function openLb(idx) {
    current = idx;
    const el = items[idx];
    const videoUrl = el.dataset.video; // Revisamos si tiene video guardado

    // Resetear estados visuales y pausar videos previos
    lbImg.style.display = 'none';
    lbVideo.style.display = 'none';
    lbVideo.pause();
    lbVideo.src = "";

    if (videoUrl) {
      // 🎥 Si es un video, configuramos y mostramos el elemento de video
      lbVideo.src = videoUrl;
      lbVideo.style.display = 'block';
      lbVideo.load();
      // Un pequeño retraso para asegurar una animación fluida al abrir
      setTimeout(() => lbVideo.style.transform = 'scale(1)', 50);
    } else {
      // 🖼️ Si es una imagen común
      lbImg.src = el.querySelector('img').src;
      lbImg.alt = el.querySelector('img').alt;
      lbImg.style.display = 'block';
    }

    lbCaption.textContent = el.dataset.title || '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    // Pausar el video inmediatamente al cerrar para que no se siga escuchando el audio
    lbVideo.pause();
    lbVideo.src = "";
    lbVideo.style.transform = 'scale(0.96)';
  }

  function move(dir) {
    current = (current + dir + items.length) % items.length;
    openLb(current);
  }

  items.forEach((el, i) => el.addEventListener('click', () => openLb(i)));
  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', () => move(-1));
  document.getElementById('lbNext').addEventListener('click', () => move(1));
  
  // Cerrar si hacen clic fuera del contenedor (en el fondo oscuro)
  lb.addEventListener('click', e => { 
    if (e.target === lb || e.target.classList.contains('lb-inner')) {
      closeLb(); 
    }
  });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  });
</script>
</body>
</html>
